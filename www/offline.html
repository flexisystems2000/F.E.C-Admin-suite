<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>You're Offline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .container {
      max-width: 360px;
    }

    .icon {
      width: 110px;
      height: 110px;
      margin: 0 auto 25px;

      border-radius: 55px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #075E54;

      font-size: 48px;

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 12px;

      font-size: 27px;

      color: #111111;
    }

    p {
      margin: 0;

      font-size: 15px;

      line-height: 1.6;

      color: #777777;
    }

    button {
      margin-top: 28px;

      border: none;

      padding: 14px 28px;

      border-radius: 12px;

      background: #075E54;

      color: #ffffff;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .small {
      margin-top: 18px;

      font-size: 12px;

      color: #999999;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">
      📡
    </div>

    <h1>
      You're Offline
    </h1>

    <p>
      We couldn't connect to F.E.C Admin Suite.
      Please check your internet connection and try again.
    </p>

    <button onclick="tryAgain()">
      🔄 Try Again
    </button>

    <div class="small">
      F.E.C Admin Suite
    </div>

  </div>

  <script>

    function tryAgain() {

      if (navigator.onLine) {

        window.location.href =
          "https://flexisystems2000.github.io/F.E.CAdminpanel/";

      } else {

        alert(
          "You're still offline. Please check your internet connection."
        );

      }

    }

  </script>

</body>
</html>
