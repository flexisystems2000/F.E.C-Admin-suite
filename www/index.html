<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>F.E.C Admin Suite</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    #splash,
    #offline {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 30px;
      background: #ffffff;
      z-index: 1000;
    }

    #offline {
      display: none;
    }

    .logo {
      width: 110px;
      height: 110px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #075e54;
      color: white;
      font-size: 32px;
      font-weight: 800;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
      margin-bottom: 25px;
    }

    h1 {
      font-size: 25px;
      color: #075e54;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
    }

    .loader {
      width: 38px;
      height: 38px;
      margin-top: 30px;
      border: 4px solid #e5e5e5;
      border-top-color: #075e54;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .offline-icon {
      font-size: 65px;
      margin-bottom: 20px;
    }

    .offline-title {
      color: #222;
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .offline-text {
      color: #777;
      font-size: 15px;
      line-height: 1.6;
      max-width: 330px;
    }

    button {
      border: none;
      background: #075e54;
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 25px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <!-- SPLASH SCREEN -->
  <div id="splash">
    <div class="logo">FEC</div>

    <h1>F.E.C Admin Suite</h1>

    <div class="subtitle">
      Flexi Educational Consult
    </div>

    <div class="loader"></div>
  </div>


  <!-- OFFLINE SCREEN -->
  <div id="offline">

    <div class="offline-icon">📡</div>

    <div class="offline-title">
      You're Offline
    </div>

    <div class="offline-text">
      It looks like your internet connection is unavailable.
      Please check your connection and try again.
    </div>

    <button onclick="tryAgain()">
      🔄 Try Again
    </button>

  </div>


  <script>
    const WEBSITE_URL =
      "https://flexisystems2000.github.io/F.E.CAdminpanel/";

    const splash = document.getElementById("splash");
    const offline = document.getElementById("offline");


    function showOffline() {
      splash.style.display = "none";
      offline.style.display = "flex";
    }


    function openWebsite() {
      window.location.href = WEBSITE_URL;
    }


    function checkConnection() {
      if (navigator.onLine) {
        openWebsite();
      } else {
        showOffline();
      }
    }


    function tryAgain() {
      if (navigator.onLine) {
        offline.style.display = "none";
        splash.style.display = "flex";

        setTimeout(() => {
          openWebsite();
        }, 300);
      } else {
        showOffline();
      }
    }


    window.addEventListener("online", () => {
      tryAgain();
    });


    window.addEventListener("offline", () => {
      showOffline();
    });


    setTimeout(checkConnection, 1200);
  </script>

</body>
</html>
