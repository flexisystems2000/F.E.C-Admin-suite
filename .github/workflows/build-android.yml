name: Build F.E.C Admin Suite Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons and splash screen
        run: npx capacitor-assets generate --android
     
      - name: Sync Capacitor
        run: npx cap sync android
            
      
      - name: Configure Android MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/java/com/flexisystems/fecadmin/MainActivity.java")

          path.parent.mkdir(parents=True, exist_ok=True)

          path.write_text(r'''package com.flexisystems.fecadmin;

          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private static final String WEBSITE_URL =
                      "https://flexisystems2000.github.io/F.E.CAdminpanel/";

              private static final String OFFLINE_URL =
                      "file:///android_asset/public/offline.html";

              private boolean showingOffline = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = getBridge().getWebView();

                  if (webView != null) {

                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.getSettings().setDomStorageEnabled(true);

                      checkInternetAndLoad(webView);
                  }
              }

              private void checkInternetAndLoad(WebView webView) {

                  new Thread(() -> {

                      boolean connected = false;

                      try {
                          java.net.URL url =
                                  new java.net.URL(WEBSITE_URL);

                          java.net.HttpURLConnection connection =
                                  (java.net.HttpURLConnection) url.openConnection();

                          connection.setRequestMethod("HEAD");
                          connection.setConnectTimeout(5000);
                          connection.setReadTimeout(5000);
                          connection.setInstanceFollowRedirects(true);

                          int responseCode =
                                  connection.getResponseCode();

                          connected =
                                  responseCode >= 200 &&
                                  responseCode < 400;

                          connection.disconnect();

                      } catch (Exception ignored) {
                          connected = false;
                      }

                      final boolean finalConnected = connected;

                      new Handler(Looper.getMainLooper()).post(() -> {

                          if (finalConnected) {

                              showingOffline = false;

                              webView.loadUrl(WEBSITE_URL);

                          } else {

                              showingOffline = true;

                              webView.loadUrl(OFFLINE_URL);
                          }
                      });

                  }).start();
              }

              public void retryConnection() {

                  WebView webView = getBridge().getWebView();

                  if (webView == null) {
                      return;
                  }

                  checkInternetAndLoad(webView);
              }

              @Override
              public void onBackPressed() {

                  WebView webView = getBridge().getWebView();

                  if (webView != null && webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      finish();
                  }
              }
          }
          ''')

          PY

      - name: Copy offline page into Android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp www/offline.html android/app/src/main/assets/public/offline.html
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FEC-Admin-Suite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
