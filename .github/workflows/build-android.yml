name: Build F.E.C Admin Suite Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm install

      # 4. Add Android platform
      - name: Add Android platform
        run: npx cap add android

      # 5. Generate app icon and splash screen
      - name: Generate Android icons and splash screen
        run: npx capacitor-assets generate --android

      # 6. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 7. Configure simple MainActivity
      - name: Configure MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/flexisystems/fecadmin

          cat > android/app/src/main/java/com/flexisystems/fecadmin/MainActivity.java <<'EOF'
          package com.flexisystems.fecadmin;

          import android.os.Bundle;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = getBridge().getWebView();

                  if (webView != null) {
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.getSettings().setDomStorageEnabled(true);
                  }
              }

              @Override
              public void onBackPressed() {

                  WebView webView = getBridge().getWebView();

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      finish();
                  }
              }
          }
          EOF

      # 8. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 9. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 10. Build APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FEC-Admin-Suite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
