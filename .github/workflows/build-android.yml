name: Build F.E.C Admin Suite Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android
            
      - name: Configure Android back button
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/java/com/flexisystems/fecadmin/MainActivity.java")

          path.parent.mkdir(parents=True, exist_ok=True)

          path.write_text("""package com.flexisystems.fecadmin;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      if (getBridge().getWebView().canGoBack()) {
                          getBridge().getWebView().goBack();
                      } else {
                          super.onBackPressed();
                      }
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """)
          PY
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FEC-Admin-Suite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
