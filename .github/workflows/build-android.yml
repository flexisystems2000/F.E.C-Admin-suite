name: Build F.E.C Admin Suite Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons and splash screen
        run: npx capacitor-assets generate --android
     
      - name: Sync Capacitor
        run: npx cap sync android
            
      - name: Configure Android MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/java/com/flexisystems/fecadmin/MainActivity.java")

          path.parent.mkdir(parents=True, exist_ok=True)

          path.write_text(r'''package com.flexisystems.fecadmin;

          import android.graphics.Color;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.Window;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends BridgeActivity {

              private static final String WEBSITE_URL =
                      "https://flexisystems2000.github.io/F.E.CAdminpanel/";

              private static final String OFFLINE_URL =
                      "file:///android_asset/public/offline.html";

              private ConnectivityManager connectivityManager;
              private ConnectivityManager.NetworkCallback networkCallback;

              private boolean offlinePageShowing = false;
              private boolean checkingConnection = false;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());


              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setupStatusBar();

                  WebView webView = getBridge().getWebView();

                  if (webView != null) {
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.getSettings().setDomStorageEnabled(true);

                      checkWebsiteConnection(webView);
                  }

                  registerNetworkListener();
              }


              private void setupStatusBar() {

                  Window window = getWindow();

                  window.setStatusBarColor(Color.WHITE);

                  window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
                  );
              }


              private void checkWebsiteConnection(WebView webView) {

                  if (checkingConnection) {
                      return;
                  }

                  checkingConnection = true;

                  new Thread(() -> {

                      boolean connected = false;

                      HttpURLConnection connection = null;

                      try {

                          URL url = new URL(WEBSITE_URL);

                          connection =
                                  (HttpURLConnection) url.openConnection();

                          connection.setRequestMethod("HEAD");
                          connection.setConnectTimeout(5000);
                          connection.setReadTimeout(5000);
                          connection.setInstanceFollowRedirects(true);

                          int responseCode =
                                  connection.getResponseCode();

                          connected =
                                  responseCode >= 200 &&
                                  responseCode < 400;

                      } catch (Exception ignored) {

                          connected = false;

                      } finally {

                          if (connection != null) {
                              connection.disconnect();
                          }
                      }

                      final boolean finalConnected = connected;

                      handler.post(() -> {

                          checkingConnection = false;

                          if (finalConnected) {

                              if (offlinePageShowing) {
                                  offlinePageShowing = false;
                                  webView.loadUrl(WEBSITE_URL);
                              }

                          } else {

                              if (!offlinePageShowing) {
                                  offlinePageShowing = true;
                                  webView.loadUrl(OFFLINE_URL);
                              }
                          }
                      });

                  }).start();
              }


              private void registerNetworkListener() {

                  connectivityManager =
                          (ConnectivityManager)
                          getSystemService(CONNECTIVITY_SERVICE);

                  if (connectivityManager == null) {
                      return;
                  }

                  networkCallback =
                          new ConnectivityManager.NetworkCallback() {

                      @Override
                      public void onLost(Network network) {

                          runOnUiThread(() -> {

                              WebView webView =
                                      getBridge().getWebView();

                              if (webView != null) {

                                  offlinePageShowing = true;

                                  webView.loadUrl(OFFLINE_URL);
                              }
                          });
                      }


                      @Override
                      public void onAvailable(Network network) {

                          WebView webView =
                                  getBridge().getWebView();

                          if (webView != null) {

                              handler.postDelayed(() -> {
                                  checkWebsiteConnection(webView);
                              }, 800);
                          }
                      }
                  };

                  connectivityManager.registerDefaultNetworkCallback(
                          networkCallback
                  );
              }


              @Override
              public void onResume() {

                  super.onResume();

                  setupStatusBar();

                  WebView webView =
                          getBridge().getWebView();

                  if (webView != null) {
                      checkWebsiteConnection(webView);
                  }
              }


              @Override
              public void onBackPressed() {

                  WebView webView =
                          getBridge().getWebView();

                  if (webView != null &&
                      webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      finish();
                  }
              }


              @Override
              public void onDestroy() {

                  if (connectivityManager != null &&
                      networkCallback != null) {

                      try {

                          connectivityManager.unregisterNetworkCallback(
                                  networkCallback
                          );

                      } catch (Exception ignored) {
                      }
                  }

                  super.onDestroy();
              }
          }
          ''')

          PY      

      - name: Copy offline page into Android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp www/offline.html android/app/src/main/assets/public/offline.html
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FEC-Admin-Suite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
