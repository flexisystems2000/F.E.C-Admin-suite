name: Build F.E.C Admin Suite Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons and splash screen
        run: npx capacitor-assets generate --android
     
      - name: Sync Capacitor
        run: npx cap sync android
            
      - name: Configure Android WebView
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/java/com/flexisystems/fecadmin/MainActivity.java")

          path.parent.mkdir(parents=True, exist_ok=True)

          path.write_text(r'''package com.flexisystems.fecadmin;

          import android.os.Bundle;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private static final String WEBSITE_URL =
                      "https://flexisystems2000.github.io/F.E.CAdminpanel/";

              private static final String OFFLINE_URL =
                      "file:///android_asset/public/offline.html";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = getBridge().getWebView();

                  if (webView != null) {

                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.getSettings().setDomStorageEnabled(true);

                      webView.setWebViewClient(new WebViewClient() {

                          @Override
                          public boolean shouldOverrideUrlLoading(
                                  WebView view,
                                  WebResourceRequest request) {

                              view.loadUrl(request.getUrl().toString());
                              return true;
                          }

                          @Override
                          public void onReceivedError(
                                  WebView view,
                                  WebResourceRequest request,
                                  WebResourceError error) {

                              if (request.isForMainFrame()) {
                                  view.loadUrl(OFFLINE_URL);
                              }
                          }

                          @Override
                          public void onReceivedHttpError(
                                  WebView view,
                                  WebResourceRequest request,
                                  WebResourceResponse response) {

                              if (request.isForMainFrame()
                                      && response.getStatusCode() >= 400) {

                                  view.loadUrl(OFFLINE_URL);
                              }
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {

                  WebView webView = getBridge().getWebView();

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      finish();
                  }
              }
          }
          ''')

          PY

      - name: Copy offline page into Android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp www/offline.html android/app/src/main/assets/public/offline.html
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FEC-Admin-Suite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
